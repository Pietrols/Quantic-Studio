[project]
name = "qe-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["qe-core", "qe-pv", "qe-plc", "qe-power", "qe-report", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.scripts]
qe-api = "qe_api.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/qe_api"]
