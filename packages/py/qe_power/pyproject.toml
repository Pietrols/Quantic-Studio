[project]
name = "qe-power"
version = "0.1.0"
description = "Quantic Studio power-system solvers and adapters"
requires-python = ">=3.12"
dependencies = [
    "qe-core",
    "numpy>=2.1,<2.5",  # pandapower 3.5.6 requires numpy<2.5
    "pandapower==3.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qe_power"]

[tool.uv.sources]
qe-core = { workspace = true }
