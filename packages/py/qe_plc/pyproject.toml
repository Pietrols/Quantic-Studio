[project]
name = "qe-plc"
version = "0.1.0"
description = "Quantic Studio PLC engine: Structured Text subset, function blocks and scan cycle"
requires-python = ">=3.12"
dependencies = ["qe-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qe_plc"]

[tool.uv.sources]
qe-core = { workspace = true }
