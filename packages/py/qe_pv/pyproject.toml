[project]
name = "qe-pv"
version = "0.1.0"
description = "Quantic Studio PV suite, engine interface seed"
requires-python = ">=3.12"
dependencies = ["qe-core", "pvlib==0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qe_pv"]

[tool.uv.sources]
qe-core = { workspace = true }
