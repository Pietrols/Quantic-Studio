[project]
name = "quantic-studio-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/py/qe_core",
    "packages/py/qe_power",
    "packages/py/qe_report",
    "packages/py/qe_cli",
    "packages/py/qe_api",
]

[tool.uv.sources]
qe-core = { workspace = true }
qe-power = { workspace = true }
qe-report = { workspace = true }
qe-cli = { workspace = true }
qe-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "qe-core",
    "qe-power",
    "qe-report",
    "qe-cli",
    "qe-api",
    "httpx>=0.27,<1",
]
