[project]
name = "quantic-studio-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/py/qe_core"]

[tool.uv.sources]
qe-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "qe-core",
    "numpy>=2.5.3",
]
