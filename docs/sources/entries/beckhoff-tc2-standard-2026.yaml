citation: TON IN falling resets Q and ET; TOF Q TRUE and ET 0 while IN TRUE, Q FALSE when IN FALSE and ET = PT; TP Q TRUE for PT irrespective of IN, ET 0 when IN and Q are FALSE; CTU Q when CV >= PV; CTUD CD decrements only while CV > 0, QD when CV is 0.
gaps: The pages do not state PT changes during timing, TP retriggering, ET after a pulse while IN stays TRUE, RESET versus count priority, RESET versus LOAD priority, simultaneous CU and CD edges, or overflow. These are Quantic subset choices in docs/specs/structured-text-subset.md section 6. Beckhoff counters use WORD; the Quantic subset uses INT after Bolton Figure 10.1.
