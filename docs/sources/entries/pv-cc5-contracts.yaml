id: pv-cc5-contracts
accessed: 2026-10-14
sources:
  - citation: Gilman, SAM Photovoltaic Model Technical Reference, NREL/TP-6A20-64102 (2015)
    pages: 18-19; 51 Eq. 11.2; 55-56
    use: Fixed surface orientation, inverter rating distinction, net AC and hourly energy. Verified readable page-tagged reference; no copied text or examples.
  - citation: pvlib python 0.16.1 documentation
    urls:
      - https://pvlib-python.readthedocs.io/en/stable/reference/generated/pvlib.pvsystem.pvwatts_dc.html
      - https://pvlib-python.readthedocs.io/en/stable/reference/generated/pvlib.inverter.pvwatts.html
      - https://pvlib-python.readthedocs.io/en/stable/reference/generated/pvlib.irradiance.isotropic.html
      - https://pvlib-python.readthedocs.io/en/stable/reference/generated/pvlib.temperature.ross.html
    use: Parameter meanings, dimensional equations and assumptions. Pages cite Dobos NREL/TP-6A20-62641 (2014) and Ross (1981); those citations are identified as secondary here.
    license_note: pvlib is BSD-3-Clause; no library code imported or copied in CC-5. Future use is restricted to qe_pv/adapters/pvlib/.
independent_reference: Original authored validation tables in test_pv_contracts.py. Hypothetical equipment, explicit signal/unit inventory, 100 W for 2 h gives 200 Wh; Gregorian leap 2024 has 8784 hours and February 696 hours. Expected answers are handwritten, never generated by an engine.
weather_rights: All weather fixtures are original synthetic values generated in temporary test folders, dedicated CC0-1.0. No downloaded weather, network access or equipment datasheet copied.
paid_standards: IEC 61724-1 is not held; no monitoring class/conformance claim. IEC 61215/61730 and IEC 62109 qualification/safety claims are outside scope. Proceed with explicit inputs and readable model documentation.
