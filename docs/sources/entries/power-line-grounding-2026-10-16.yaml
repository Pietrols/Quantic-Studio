  - TransLineCalc v2, dated 2013-04-22, input descriptions and sections 3.1 to 3.4 read; printed p.15, PDF p.17, rendered with Poppler and visually checked.
  - NERC public December 2013 Application Guide, chapter 2 nodal method and practical details read selectively; printed pp.16 and 18, PDF pp.19 and 21, rendered and visually checked.
