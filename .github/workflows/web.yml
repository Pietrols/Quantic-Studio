name: Web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:check
      - run: pnpm --filter qe-web test
      - run: pnpm --filter qe-web build
      - run: pnpm --filter qe-web exec playwright install --with-deps chromium
      - run: pnpm --filter qe-web e2e
